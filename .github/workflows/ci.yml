name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build (matrix in shell)
        run: |
          mkdir -p dist
          set -e
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${platform%/*}"; GOARCH="${platform#*/}"
            EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -o "dist/y-sync-server-${GOOS}-${GOARCH}${EXT}" ./cmd/y-sync-server
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -o "dist/y-sync-${GOOS}-${GOARCH}${EXT}" ./cmd/ysync
          done
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check（服务端/客户端 Rust 实现）
        run: cargo check -p ysync-core -p ysyncd -p ysync-server-rs
      - name: Test
        run: cargo test -p ysync-core -p ysyncd -p ysync-server-rs

  rust-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check（Tauri 桌面壳）
        run: cargo check -p ysync-desktop
