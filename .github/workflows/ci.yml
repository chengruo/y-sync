name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check（服务端/客户端 Rust 实现）
        run: cargo check -p ysync-core -p ysyncd -p ysync-server-rs
      - name: Test
        run: cargo test -p ysync-core -p ysyncd -p ysync-server-rs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check（服务端/客户端 Rust 实现）
        run: cargo check -p ysync-core -p ysyncd -p ysync-server-rs
      - name: Test
        run: cargo test -p ysync-core -p ysyncd -p ysync-server-rs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build（多平台 Rust 服务端/客户端）
        run: |
          V="${GITHUB_REF_NAME#v}"; V="${V:-$(git rev-parse --short HEAD)}"
          mkdir -p dist
          set -e
          Y_SYNC_VERSION="$V" cargo build --release -p ysync-server-rs --target x86_64-unknown-linux-gnu
          cargo build --release -p ysyncd --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/ysync-server-rs "dist/y-sync-server-rs-linux-amd64-$V"
          cp target/x86_64-unknown-linux-gnu/release/ysyncd "dist/ysyncd-rs-linux-amd64-$V"
          ls -la dist/

  rust-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check（Tauri 桌面壳）
        run: cargo check -p ysync-desktop

  # 端到端验证（Rust 全实现跑主 e2e + 特性验证 + 混沌）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 Rust 双端
        run: |
          mkdir -p bin
          cargo build --release -p ysyncd -p ysync-server-rs
          cp target/release/ysyncd bin/ysyncd-rs
          cp target/release/ysync-server-rs bin/y-sync-server-rs
      - name: 主 e2e（Rust 全实现）
        run: SERVER_BIN=bin/y-sync-server-rs BIN_A=bin/ysyncd-rs BIN_B=bin/ysyncd-rs bash scripts/e2e.sh
      - name: 特性验证
        run: bash scripts/e2e-features.sh
      - name: 混沌长跑（6 轮）
        run: bash scripts/chaos.sh 6

  # 自动部署（需配置 Secrets: DEPLOY_HOST / DEPLOY_USER / DEPLOY_KEY）
  deploy:
    runs-on: ubuntu-latest
    needs: [rust]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建服务端
        run: |
          V="${GITHUB_REF_NAME#v}"; V="${V:-$(git rev-parse --short HEAD)}"
          echo "Y_SYNC_VERSION=$V" >> "$GITHUB_ENV"
          Y_SYNC_VERSION="$V" cargo build --release -p ysync-server-rs
          cp target/release/ysync-server-rs /tmp/y-sync-server-rs
      - name: 部署到服务器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_VERSION: ${{ github.ref_name }}
          BIN: /tmp/y-sync-server-rs
        run: |
          [ -n "$DEPLOY_HOST" ] || { echo "未配置 DEPLOY_HOST 等 Secrets，跳过部署"; exit 0; }
          bash scripts/deploy.sh
