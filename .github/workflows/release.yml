# 发布流水线：Go 冻结产物 + Rust 全平台产物 + Tauri 桌面包，统一挂到 GitHub Release。
# 推送 v* tag 自动触发。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ---------- Rust 服务端/客户端 ----------
  release-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: linux-amd64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, name: linux-arm64, cross: "1" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: darwin-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: darwin-amd64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装 aarch64 交叉链接器
        if: matrix.cross == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build server + client
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          export Y_SYNC_VERSION="$V"
          for pkg in ysync-server-rs ysyncd; do
            cargo build --release -p "$pkg" --target "${{ matrix.target }}"
            SRC="target/${{ matrix.target }}/release"
            NAME="$pkg-${{ matrix.name }}"
            [ -f "$SRC/$pkg" ] && cp "$SRC/$pkg" "dist/$NAME"
            [ -f "$SRC/$pkg.exe" ] && cp "$SRC/$pkg.exe" "dist/$NAME.exe"
          done
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-rust-${{ matrix.name }}
          path: dist/

  # ---------- Tauri 桌面安装包（P0-2） ----------
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macos }   # .dmg / .app
          - { os: ubuntu-latest,  name: linux }   # .deb / .AppImage
          - { os: windows-latest, name: windows } # .msi / .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.name }}
      - name: 安装 Linux 打包依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Tauri build
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          npx -y @tauri-apps/cli@2 build
          mkdir -p bundle-out
          # workspace 构建：target/ 在仓库根；非 workspace 布局兜底 src-tauri/target
          find target/release/bundle src-tauri/target/release/bundle -maxdepth 3 -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.deb" -o -name "*.AppImage" \
               -o -name "*.msi" -o -name "*-setup.exe" \) 2>/dev/null \
            -exec cp {} bundle-out/ \; || true
          [ -n "$(ls -A bundle-out 2>/dev/null)" ] || { echo "::error::未找到打包产物"; exit 1; }
          ls -la bundle-out/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-${{ matrix.name }}
          path: bundle-out/

  # ---------- 汇总发布 ----------
  publish:
    runs-on: ubuntu-latest
    needs: [release-rust, release-desktop]
    steps:
      - uses: actions/checkout@v4
      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
      - name: 收集
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: y-sync ${{ github.ref_name }}
          body: |
            轻量文件同步服务 y-sync 发布版本 ${{ github.ref_name }}。

            **推荐使用 Rust 实现**（Go 实现已冻结）：
            - `ysync-server-rs-*`：Rust 服务端
            - `ysyncd-rs-*`：Rust 客户端（命令行）
            - `y-sync_*` / `y-sync-*`：桌面安装包（Tauri：托盘 + 管理台）
            - `y-sync-server-*` / `y-sync-*`（无 rs 后缀）：Go 冻结版（仅存量参考）

            一键安装（Linux/macOS）：
            `curl -fsSL https://raw.githubusercontent.com/chengruo/y-sync/main/scripts/install.sh | bash`
          files: dist/*
          generate_release_notes: true
