# y-sync GitLab CI：Rust 测试/构建 → tag 自动发布
#
# 说明：项目已迁移至 Rust 实现（Go 版已移除）。

stages:
  - test
  - build
  - release

default:
  interruptible: true

rust:
  stage: test
  image: rust:latest
  cache:
    key: cargo
    paths:
      - .cargo/
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  script:
    - cargo check -p ysync-core -p ysyncd -p ysync-server-rs
    - cargo test -p ysync-core -p ysyncd -p ysync-server-rs

rust-build:
  stage: build
  image: rust:latest
  cache:
    key: cargo
    paths:
      - .cargo/
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  script:
    - V="${CI_COMMIT_REF_NAME#v}"; V="${V:-$CI_COMMIT_SHORT_SHA}"
    - Y_SYNC_VERSION="$V" cargo build --release -p ysync-server-rs
    - mkdir -p dist && cp target/release/ysync-server-rs "dist/y-sync-server-rs-linux-amd64-$V"
    - cp target/release/ysyncd "dist/ysyncd-rs-linux-amd64-$V" || true
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

rust-deploy:
  stage: release
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  script:
    - apt-get update -qq && apt-get install -y -qq openssh-client git
    - bash scripts/deploy.sh
