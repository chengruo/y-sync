<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 浅色/精细毛玻璃金属底板 -->
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8ecf2" />
    </linearGradient>

    <linearGradient id="border-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b0b8c4" stop-opacity="0.3" />
    </linearGradient>

    <!-- 拓扑支路渐变：左上、右上与下行主干 -->
    <linearGradient id="branch-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>

    <linearGradient id="branch-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="branch-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="shadow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00438f" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- 背景：macOS 精致白玉/浅银 Squircle 底板 -->
  <g id="background">
    <rect x="44" y="44" width="424" height="424" rx="98" fill="url(#bg-grad-2)" />
    <rect x="44" y="44" width="424" height="424" rx="98" fill="none" stroke="url(#border-grad-2)" stroke-width="2.5" />
  </g>

  <!-- 核心图标：三向分流 Y 拓扑与闭环对流 -->
  <g id="icon" filter="url(#shadow-2)">
    <!-- 左上分支 (客户端A) -->
    <path d="M 148 152 Q 220 220, 256 256" 
          fill="none" 
          stroke="url(#branch-left)" 
          stroke-width="44" 
          stroke-linecap="round" />
    <!-- 左上终端节点 -->
    <circle cx="148" cy="152" r="28" fill="#38bdf8" />
    <circle cx="148" cy="152" r="14" fill="#ffffff" />

    <!-- 右上分支 (服务端/云端) -->
    <path d="M 364 152 Q 292 220, 256 256" 
          fill="none" 
          stroke="url(#branch-right)" 
          stroke-width="44" 
          stroke-linecap="round" />
    <!-- 右上终端节点 -->
    <circle cx="364" cy="152" r="28" fill="#0071e3" />
    <circle cx="364" cy="152" r="14" fill="#ffffff" />

    <!-- 垂直主干 (落盘与本地同步) -->
    <path d="M 256 256 L 256 364" 
          fill="none" 
          stroke="url(#branch-stem)" 
          stroke-width="44" 
          stroke-linecap="round" />
    <!-- 底部终端节点 -->
    <circle cx="256" cy="364" r="28" fill="#0f172a" />
    <circle cx="256" cy="364" r="14" fill="#38bdf8" />

    <!-- 中心同步枢纽：旋转同步环形箭头 -->
    <path d="M 230 226 A 36 36 0 0 1 292 256" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-linecap="round" />
    <polygon points="296,250 286,268 276,252" fill="#ffffff" />

    <path d="M 282 286 A 36 36 0 0 1 220 256" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-linecap="round" />
    <polygon points="216,262 226,244 236,260" fill="#ffffff" />
  </g>

  <!-- 视觉高光点 -->
  <g id="accent">
    <circle cx="256" cy="256" r="10" fill="#ffffff" />
  </g>
</svg>
