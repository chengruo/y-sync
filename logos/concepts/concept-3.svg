<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 深邃科技午夜蓝背景 -->
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="100%" stop-color="#090e17" />
    </linearGradient>

    <!-- 侧板左侧：科技纯蓝 -->
    <linearGradient id="sheet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0052b3" />
    </linearGradient>

    <!-- 侧板右侧：发光亮天蓝 -->
    <linearGradient id="sheet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>

    <!-- 贯穿同步流：下穿支臂 -->
    <linearGradient id="sheet-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="shadow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0071e3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 背景：macOS 精雕 Squircle 底板 -->
  <g id="background">
    <rect x="44" y="44" width="424" height="424" rx="98" fill="url(#bg-grad-3)" />
    <rect x="44" y="44" width="424" height="424" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" />
  </g>

  <!-- 核心图标：双层三维折叠文件晶格，交错构筑出律动的 Y 形同步体 -->
  <g id="icon" filter="url(#shadow-3)">
    <!-- 左翼同步板块（左上分支） -->
    <path d="M 160 135 L 230 135 L 270 240 L 200 240 Z" 
          fill="url(#sheet-left)" 
          rx="10" />
    <polygon points="160,135 230,135 270,240 200,240" fill="url(#sheet-left)" />

    <!-- 右翼同步主板（右上连贯至下摆的斜长板） -->
    <polygon points="352,135 282,135 170,345 240,345" fill="url(#sheet-right)" />

    <!-- 叠层高光交界线 -->
    <line x1="200" y1="240" x2="270" y2="240" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- 左侧同步对流环弯（象征文件流入右侧） -->
    <path d="M 180 200 C 130 200, 130 290, 180 290" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="14" 
          stroke-linecap="round" />
    <polygon points="180,278 198,290 180,302" fill="#38bdf8" />

    <!-- 右侧同步对流环弯（象征服务端回写本地） -->
    <path d="M 332 280 C 382 280, 382 190, 332 190" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="14" 
          stroke-linecap="round" />
    <polygon points="332,202 314,190 332,178" fill="#ffffff" />
  </g>

  <g id="accent">
    <!-- 下部锚点 -->
    <circle cx="170" cy="345" r="8" fill="#38bdf8" />
  </g>
</svg>
