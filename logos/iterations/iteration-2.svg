<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景渐变：macOS 深空午夜质感 -->
    <linearGradient id="bg-grad-it2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2436" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <!-- 边框细高光 -->
    <linearGradient id="border-grad-it2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- 流动主渐变：Apple 科技蓝到天空青 -->
    <linearGradient id="flow-grad-it2-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#0256b8" />
    </linearGradient>

    <linearGradient id="flow-grad-it2-b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 强化立体阴影 -->
    <filter id="shadow-it2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0071e3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 背景：macOS 精致 Squircle 底板 -->
  <g id="background">
    <rect x="44" y="44" width="424" height="424" rx="98" fill="url(#bg-grad-it2)" />
    <rect x="44" y="44" width="424" height="424" rx="98" fill="none" stroke="url(#border-grad-it2)" stroke-width="2.5" />
  </g>

  <!-- 核心图标：优化内腔负空间，线宽加粗至 44px，箭头放大 30% -->
  <g id="icon" filter="url(#shadow-it2)">
    <!-- 上行流环（从左向右上旋转） -->
    <path d="M 160 180 C 160 110, 236 100, 256 160 C 276 218, 305 272, 352 272 C 396 272, 404 212, 368 174 C 342 144, 308 152, 298 156" 
          fill="none" 
          stroke="url(#flow-grad-it2-b)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 强化箭头 1 (右上顺向飞入) -->
    <polygon points="314,130 274,162 318,194" fill="#38bdf8" />

    <!-- 下行回路（从右向左下旋转） -->
    <path d="M 352 272 C 352 342, 276 352, 256 292 C 236 234, 207 180, 160 180 C 116 180, 108 240, 144 278 C 170 308, 204 300, 214 296" 
          fill="none" 
          stroke="url(#flow-grad-it2-a)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 强化箭头 2 (左下逆向飞入) -->
    <polygon points="198,322 238,290 194,258" fill="#0071e3" />

    <!-- 垂直主干：强化 Y 字立柱支撑感 -->
    <path d="M 256 280 L 256 366" 
          stroke="url(#flow-grad-it2-a)" 
          stroke-width="42" 
          stroke-linecap="round" />
    <!-- 稳固落盘终端点 -->
    <circle cx="256" cy="370" r="21" fill="#38bdf8" />
    <circle cx="256" cy="370" r="10" fill="#ffffff" />
  </g>

  <!-- 视觉核心微光 -->
  <g id="accent">
    <circle cx="256" cy="180" r="10" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
