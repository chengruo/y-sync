<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景：Apple 经典科技蓝通透渐变 -->
    <linearGradient id="bg-grad-it4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0084ff" />
      <stop offset="100%" stop-color="#004eb3" />
    </linearGradient>

    <!-- 顶部玻璃反光 -->
    <linearGradient id="highlight-it4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- 白色与天青色流环渐变 -->
    <linearGradient id="flow-top-it4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="flow-bottom-it4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 柔和深蓝底板投射阴影 -->
    <filter id="shadow-it4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#002d6b" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 背景：macOS 经典高能科技蓝 Squircle 图标底板 -->
  <g id="background">
    <rect x="44" y="44" width="424" height="424" rx="98" fill="url(#bg-grad-it4)" />
    <!-- 内部玻璃倒角高光切线 -->
    <rect x="44" y="44" width="424" height="424" rx="98" fill="none" stroke="url(#highlight-it4)" stroke-width="2.5" />
  </g>

  <!-- 核心图标：纯白与高亮青莫比乌斯流环（极致反差辨识度） -->
  <g id="icon" filter="url(#shadow-it4)">
    <!-- 上行流环 -->
    <path d="M 160 180 C 160 110, 236 100, 256 160 C 276 218, 305 272, 352 272 C 396 272, 404 212, 368 174 C 342 144, 308 152, 298 156" 
          fill="none" 
          stroke="url(#flow-top-it4)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 强化箭头 1 -->
    <polygon points="314,130 274,162 318,194" fill="#ffffff" />

    <!-- 下行回路 -->
    <path d="M 352 272 C 352 342, 276 352, 256 292 C 236 234, 207 180, 160 180 C 116 180, 108 240, 144 278 C 170 308, 204 300, 214 296" 
          fill="none" 
          stroke="url(#flow-bottom-it4)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 强化箭头 2 -->
    <polygon points="198,322 238,290 194,258" fill="#38bdf8" />

    <!-- 垂直主干 -->
    <path d="M 256 280 L 256 366" 
          stroke="#ffffff" 
          stroke-width="42" 
          stroke-linecap="round" />
    <circle cx="256" cy="370" r="21" fill="#38bdf8" />
    <circle cx="256" cy="370" r="10" fill="#ffffff" />
  </g>

  <!-- 视觉核心微光 -->
  <g id="accent">
    <circle cx="256" cy="180" r="10" fill="#ffffff" />
  </g>
</svg>
